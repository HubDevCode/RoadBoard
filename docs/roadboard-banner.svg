<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bannerbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232933"/>
      <stop offset="1" stop-color="#121519"/>
    </linearGradient>
    <linearGradient id="road" gradientUnits="userSpaceOnUse" x1="352" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#f5c518"/>
      <stop offset="0.8" stop-color="#f5c518"/>
      <stop offset="1" stop-color="#f5c518" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="28" fill="url(#bannerbg)"/>
  <g transform="translate(66 36) scale(0.9375)">
  <defs>
    <linearGradient id="i_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c333e"/>
      <stop offset="1" stop-color="#14181d"/>
    </linearGradient>
    <linearGradient id="i_rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd84a"/>
      <stop offset="1" stop-color="#e0a800"/>
    </linearGradient>
    <linearGradient id="i_asphalt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="0.5" stop-color="#1c2027"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="i_shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#i_bg)" stroke="url(#i_rim)" stroke-width="8"/>
  <rect x="12" y="12" width="232" height="116" rx="52" fill="url(#i_shine)"/>
  <!-- three fader tracks drawn as roads -->
  <g>
    <rect x="53" y="44" width="34" height="168" rx="10" fill="url(#i_asphalt)" stroke="#3c4552" stroke-width="2"/>
    <rect x="111" y="44" width="34" height="168" rx="10" fill="url(#i_asphalt)" stroke="#3c4552" stroke-width="2"/>
    <rect x="169" y="44" width="34" height="168" rx="10" fill="url(#i_asphalt)" stroke="#3c4552" stroke-width="2"/>
    <g stroke="#f5c518" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 11">
      <line x1="70" y1="56" x2="70" y2="200"/>
      <line x1="128" y1="56" x2="128" y2="200"/>
      <line x1="186" y1="56" x2="186" y2="200"/>
    </g>
  </g>
  <!-- fader caps in the console group colours -->
  <g stroke="#0d1014" stroke-width="3">
    <rect x="42" y="132" width="56" height="28" rx="7" fill="#3fc1ff"/>
    <rect x="100" y="78" width="56" height="28" rx="7" fill="#f5c518"/>
    <rect x="158" y="154" width="56" height="28" rx="7" fill="#2fbf71"/>
  </g>
  <g stroke="#0d1014" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="52" y1="146" x2="88" y2="146"/>
    <line x1="110" y1="92" x2="146" y2="92"/>
    <line x1="168" y1="168" x2="204" y2="168"/>
  </g>
</g>
  <text x="350" y="172" font-family="Inter, 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="118" letter-spacing="-2"><tspan fill="#eef2f6">Road</tspan><tspan fill="#f5c518">Board</tspan></text>
  <line x1="354" y1="206" x2="1200" y2="206" stroke="url(#road)" stroke-width="5" stroke-dasharray="28 18" stroke-linecap="round"/>
  <text x="354" y="256" font-family="Inter, 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif" font-size="32" fill="#9aa5b1">Virtual audio mixing console for Linux · PipeWire</text>
</svg>
